name: Deployment pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm install
      - name: Lint backend
        run: npm run lint
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build:ui

  test:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      SECRET: ${{ secrets.SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check test database variable
        run: |
          if [ -z "$TEST_MONGODB_URI" ]; then
            echo "TEST_MONGODB_URI is EMPTY: check the repository secret name and location"
            exit 1
          fi
          case "$TEST_MONGODB_URI" in
            mongodb+srv://*|mongodb://*) echo "TEST_MONGODB_URI format looks valid" ;;
            *) echo "TEST_MONGODB_URI has a wrong format: it must start with mongodb+srv://"; exit 1 ;;
          esac
      - name: Install backend dependencies
        run: npm install
      - name: Run backend tests
        run: npm test
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend
      - name: Run frontend tests
        run: npm test --if-present -- --run
        working-directory: frontend

  deploy:
    needs: [lint, build, test]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

  tag_release:
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # 1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: master

  notify_success:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on success
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "A new version of the bloglist deployed"
          description: "to https://<name>.onrender.com by ${{ github.actor }}"

  notify_failure:
    needs: [lint, build, test, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on failure
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Build failed"
          description: |
            Commit ${{ github.sha }} by ${{ github.actor }} broke the build.
            Commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}