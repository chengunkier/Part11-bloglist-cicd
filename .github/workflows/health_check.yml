name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://<name>.onrender.com/health
          max-attempts: 3
          retry-delay: 5s

      - name: Notify Discord on failure
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Health check failed"
          description: "The deployed bloglist did not respond. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"